name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: Install static analyzers
        run: sudo apt-get update && sudo apt-get install -y cppcheck shellcheck
      - uses: jdx/mise-action@v3
      - run: bash tools/check.sh

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host regressions
        run: bash tools/test.sh

  esphome-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned ESPHome
        run: python -m pip install esphome==2026.10.2
      - name: Compile local component example
        run: esphome compile example.yaml
